aid: apptainer
name: Apptainer
description: >-
  Apptainer, formerly Singularity, is a Linux Foundation project providing a
  high-performance container runtime optimized for high-performance computing and
  scientific workloads. It enables reproducible, portable scientific computing
  with support for existing Docker/OCI containers and integration with HPC
  schedulers.
