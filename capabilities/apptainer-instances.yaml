naftiko: 1.0.0-alpha2
info:
  label: Apptainer Container Runtime API — Instances
  description: 'Apptainer Container Runtime API — Instances. 2 operations. Lead operation: Apptainer - List Instances. Self-contained
    Naftiko capability covering one Apptainer business surface.'
  tags:
  - Apptainer
  - Instances
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    APPTAINER_API_KEY: APPTAINER_API_KEY
capability:
  consumes:
  - type: http
    namespace: apptainer-instances
    baseUri: https://api.apptainer.org/v1
    description: Apptainer Container Runtime API — Instances business capability. Self-contained, no shared references.
    resources:
    - name: instances
      path: /instances
      operations:
      - name: listinstances
        method: GET
        description: Apptainer - List Instances
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: startinstance
        method: POST
        description: Apptainer - Start Instance
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.APPTAINER_API_KEY}}'
  exposes:
  - type: rest
    namespace: apptainer-instances-rest
    port: 8080
    description: REST adapter for Apptainer Container Runtime API — Instances. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/instances
      name: instances
      description: REST surface for instances.
      operations:
      - method: GET
        name: listinstances
        description: Apptainer - List Instances
        call: apptainer-instances.listinstances
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: startinstance
        description: Apptainer - Start Instance
        call: apptainer-instances.startinstance
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: apptainer-instances-mcp
    port: 9090
    transport: http
    description: MCP adapter for Apptainer Container Runtime API — Instances. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: apptainer-list-instances
      description: Apptainer - List Instances
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: apptainer-instances.listinstances
      outputParameters:
      - type: object
        mapping: $.
    - name: apptainer-start-instance
      description: Apptainer - Start Instance
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: apptainer-instances.startinstance
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
