naftiko: 1.0.0-alpha2
info:
  label: Apptainer Container Runtime API — Images
  description: 'Apptainer Container Runtime API — Images. 3 operations. Lead operation: Apptainer - List Images. Self-contained
    Naftiko capability covering one Apptainer business surface.'
  tags:
  - Apptainer
  - Images
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    APPTAINER_API_KEY: APPTAINER_API_KEY
capability:
  consumes:
  - type: http
    namespace: apptainer-images
    baseUri: https://api.apptainer.org/v1
    description: Apptainer Container Runtime API — Images business capability. Self-contained, no shared references.
    resources:
    - name: images
      path: /images
      operations:
      - name: listimages
        method: GET
        description: Apptainer - List Images
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: format
          in: query
          type: string
          description: Filter by image format (SIF or sandbox)
        - name: name
          in: query
          type: string
          description: Filter by image name
      - name: pullimage
        method: POST
        description: Apptainer - Pull Image
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: images-imageId
      path: /images/{imageId}
      operations:
      - name: getimage
        method: GET
        description: Apptainer - Get Image
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: imageId
          in: path
          type: string
          description: Unique container image identifier
          required: true
    authentication:
      type: bearer
      token: '{{env.APPTAINER_API_KEY}}'
  exposes:
  - type: rest
    namespace: apptainer-images-rest
    port: 8080
    description: REST adapter for Apptainer Container Runtime API — Images. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/images
      name: images
      description: REST surface for images.
      operations:
      - method: GET
        name: listimages
        description: Apptainer - List Images
        call: apptainer-images.listimages
        with:
          format: rest.format
          name: rest.name
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: pullimage
        description: Apptainer - Pull Image
        call: apptainer-images.pullimage
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/images/{imageid}
      name: images-imageid
      description: REST surface for images-imageId.
      operations:
      - method: GET
        name: getimage
        description: Apptainer - Get Image
        call: apptainer-images.getimage
        with:
          imageId: rest.imageId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: apptainer-images-mcp
    port: 9090
    transport: http
    description: MCP adapter for Apptainer Container Runtime API — Images. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: apptainer-list-images
      description: Apptainer - List Images
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: apptainer-images.listimages
      with:
        format: tools.format
        name: tools.name
      outputParameters:
      - type: object
        mapping: $.
    - name: apptainer-pull-image
      description: Apptainer - Pull Image
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: apptainer-images.pullimage
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: apptainer-get-image
      description: Apptainer - Get Image
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: apptainer-images.getimage
      with:
        imageId: tools.imageId
      outputParameters:
      - type: object
        mapping: $.
